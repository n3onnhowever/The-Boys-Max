# One dedicated Moscow VM. Run only with -p povod-ru-https; never share volumes with another stack.
name: povod-ru-https
services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_DB: povod
      POSTGRES_USER: povod
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ${POVOD_PG_PASSWORD_FILE:?set absolute path to root-owned password file}:/run/secrets/pg_password:ro
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U povod -d povod']
      interval: 10s
      timeout: 3s
      retries: 12
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  redis:
    image: redis:8.2.9@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 512mb, --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  migrate:
    image: ${POVOD_IMAGE:?set immutable image tag built from reviewed SHA}
    environment: {RUNTIME_FILE: /run/povod/runtime.json, APP_MODE: live, NODE_ENV: production, MAX_INGRESS_MODE: WEBHOOK}
    volumes:
      - ${POVOD_RUNTIME_FILE:?set absolute path to root-owned runtime JSON}:/run/povod/runtime.json:ro
    command: [node, dist/scripts/migrate.js]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    restart: 'no'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  api:
    image: ${POVOD_IMAGE:?set immutable image tag built from reviewed SHA}
    environment: {RUNTIME_FILE: /run/povod/runtime.json, APP_MODE: live, NODE_ENV: production, MAX_INGRESS_MODE: WEBHOOK}
    volumes:
      - ${POVOD_RUNTIME_FILE:?set absolute path to root-owned runtime JSON}:/run/povod/runtime.json:ro
    command: [node, dist/apps/api/main.js]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [private, edge]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  worker:
    image: ${POVOD_IMAGE:?set immutable image tag built from reviewed SHA}
    environment: {RUNTIME_FILE: /run/povod/runtime.json, APP_MODE: live, NODE_ENV: production, MAX_INGRESS_MODE: WEBHOOK}
    volumes:
      - ${POVOD_RUNTIME_FILE:?set absolute path to root-owned runtime JSON}:/run/povod/runtime.json:ro
    command: [node, dist/apps/worker/main.js]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [private, edge]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, scripts/health-worker.cjs]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_grace_period: 30s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  https:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment: {PUBLIC_HOSTNAME: '${PUBLIC_HOSTNAME:?set DNS hostname controlled for HTTPS}'}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ['80:80', '443:443']
    depends_on:
      api: {condition: service_healthy}
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
networks:
  private: {internal: true}
  edge: {}
