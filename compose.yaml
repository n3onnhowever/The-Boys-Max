name: the-boys-integration26-test
services:
  init:
    image: node:24.20.0-bookworm-slim
    user: "0:0"
    volumes: ["./scripts:/scripts:ro", "runtime:/runtime"]
    command: ["sh","-c","node /scripts/init-test.mjs /runtime/test.json && chown -R 1000:1000 /runtime"]
    networks: [test]
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: max23_test
      POSTGRES_USER: max23
      # Isolated test-only password, not a credential to any external account. No host port is exposed.
      POSTGRES_PASSWORD: max23_test
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U max23 -d max23_test"], interval: 2s, timeout: 2s, retries: 30}
    networks: [test]
  redis:
    image: redis:8.2.9
    command: ["redis-server","--appendonly","yes","--appendfsync","everysec","--maxmemory","256mb","--maxmemory-policy","noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 30}
    networks: [test]
  migrate:
    build: .
    environment: {RUNTIME_FILE: /runtime/test.json}
    volumes: ["runtime:/runtime:ro"]
    command: ["npm","run","migrate"]
    depends_on: {init: {condition: service_completed_successfully}, postgres: {condition: service_healthy}}
    networks: [test]
  prepare:
    build: .
    environment: {RUNTIME_FILE: /runtime/test.json}
    volumes: ["runtime:/runtime:ro"]
    command: ["sh","-c","npm run seed:test && node --experimental-strip-types scripts/arm-test-outbound.ts"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    networks: [test]
  api:
    build: .
    environment: {RUNTIME_FILE: /runtime/test.json}
    volumes: ["runtime:/runtime:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {prepare: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 30}
    stop_grace_period: 30s
    networks: [test]
  worker:
    build: .
    command: ["node","dist/apps/worker/main.js"]
    environment: {RUNTIME_FILE: /runtime/test.json}
    volumes: ["runtime:/runtime:ro"]
    depends_on: {prepare: {condition: service_completed_successfully}}
    stop_grace_period: 30s
    networks: [test]
  checks:
    build: .
    profiles: [checks]
    command: ["npm","run","test:integration"]
    environment: {RUNTIME_FILE: /runtime/test.json, RUN_MAX23_INTEGRATION: "1"}
    volumes: ["runtime:/runtime:ro"]
    depends_on: {prepare: {condition: service_completed_successfully}}
    networks: [test]
volumes: {pgdata: {},redisdata: {},runtime: {}}
networks:
  test: {internal: true}
